[package]
name = "multus-ct"
version = "0.2.0"
edition = "2021"

[dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }
kube = { version = "2.0.1", features = ["runtime", "client", "rustls-tls"] }
k8s-openapi = { version = "0.26.1", features = ["v1_34"] }
serde_json = "1.0.145"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
futures = "0.3.31"
anyhow = "1.0.100"
kube-leader-election = "0.42"
prometheus = "0.14"
warp = { version = "0.4.2", features = ["server"] }
