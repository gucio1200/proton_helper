---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: multus-controller
  namespace: networking
  labels:
    app: multus-controller

---
# Cluster-wide: read nodes and pods, patch node taints, record events on nodes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: multus-controller-runner
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: multus-controller-runner-binding
subjects:
  - kind: ServiceAccount
    name: multus-controller
    namespace: networking
roleRef:
  kind: ClusterRole
  name: multus-controller-runner
  apiGroup: rbac.authorization.k8s.io

---
# Leader election lease lives in the controller's own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: multus-controller-leader-election
  namespace: networking
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: multus-controller-leader-election-binding
  namespace: networking
subjects:
  - kind: ServiceAccount
    name: multus-controller
    namespace: networking
roleRef:
  kind: Role
  name: multus-controller-leader-election
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multus-controller
  namespace: networking
  labels:
    app: multus-controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app: multus-controller
  template:
    metadata:
      labels:
        app: multus-controller
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: multus-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      # Keep the two replicas apart so one drained node cannot take both down.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: multus-controller
      containers:
        - name: controller
          # Rebuild from this source and bump the tag; 63c1659 predates these changes.
          image: unixology/multus-ct:63c1659
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http-metrics
          env:
            - name: RUST_LOG
              value: "info,multus_ct=debug"
            - name: MULTUS_LABEL_SELECTOR
              value: "app.kubernetes.io/name=multus"
            # Taints left by earlier versions under this key or a valueless CriticalAddonsOnly are cleaned up automatically.
            - name: TAINT_KEY
              value: "multus.network.k8s.io/readiness"
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
      # The controller must be schedulable on nodes it has tainted itself and on system pools.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: multus.network.k8s.io/readiness
          operator: Exists
          effect: NoSchedule
        - key: CriticalAddonsOnly
          operator: Exists
          effect: NoSchedule

---
apiVersion: v1
kind: Service
metadata:
  name: multus-controller-metrics
  namespace: networking
  labels:
    app: multus-controller
spec:
  selector:
    app: multus-controller
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
